services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: allevia_simulator_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=true
      - ALLOWED_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
      - SIMULATOR_SECRET=local-dev-secret-key-32-chars-min
      - TELEMETRY_SOURCE=simulated
    volumes:
      - ./backend:/app
      - ./scenarios:/scenarios
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: allevia_simulator_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
